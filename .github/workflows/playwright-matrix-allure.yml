name: Playwright Matrix + Allure

on:
  push:
    branches:
      #- main
      - homework_22
    paths:
      - 'qa_homework_eighteen/**'
      - '.github/workflows/playwright-matrix-allure.yml'
  pull_request:
    branches:
      #- main
      - homework_22
    paths:
      - 'qa_homework_eighteen/**'
      - '.github/workflows/playwright-matrix-allure.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  playwright-tests:
    runs-on: ubuntu-latest

    # all `run:` commands in this job will execute in qa_homework_eighteen
    defaults:
      run:
        working-directory: qa_homework_eighteen
    
    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      LOGIN_USERNAME: ${{ secrets.LOGIN_USERNAME }}
      LOGIN_PASSWORD: ${{ secrets.LOGIN_PASSWORD }}

    strategy:
      matrix:
        suite: [ "bookstore", "book", "login" ]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # Запуск одного з трьох наборів тестів:
      # npm run test:bookstore
      # npm run test:book
      # npm run test:login
      - name: "Run test suite: ${{ matrix.suite }}"
        run: npm run test:${{ matrix.suite }}

      # Встановлюю Allure CLI (щоб генерувати репорт у CI)
      - name: Install Allure CLI
        run: npm install -g allure-commandline --save-dev

      # Генерую Allure репорт для кожного suite в окрему папку
      - name: Generate Allure report for ${{ matrix.suite }}
        run: |
          mkdir -p allure-report/${{ matrix.suite }}
          allure generate ./allure-results --clean -o ./allure-report/${{ matrix.suite }}

      # Зберігаю сирі allure-results як artifact
      - name: Upload allure-results (${{ matrix.suite }})
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.suite }}
          # path is from repo root, so include subfolder
          path: qa_homework_eighteen/allure-results
          retention-days: 30

      # Зберігаю готовий HTML-репорт як artifact
      - name: Upload allure-report (${{ matrix.suite }})
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ matrix.suite }}
          # same here – prefix with project folder
          path: qa_homework_eighteen/allure-report/${{ matrix.suite }}
          retention-days: 30

# pages job
  publish-allure:
    needs: playwright-tests
    runs-on: ubuntu-latest

    # optional: only publish from homework_22, not from forks, etc.
    if: github.ref == 'refs/heads/homework_22'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download Allure report artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: allure-report-*
          path: ./public
          merge-multiple: true

      # public now contains:
      #   public/qa_homework_eighteen/allure-report/bookstore/index.html
      #   public/qa_homework_eighteen/allure-report/book/index.html
      #   public/qa_homework_eighteen/allure-report/login/index.html

      - name: Create index.html with links
        run: |
          mkdir -p public
          cat > public/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8" />
            <title>Allure reports</title>
          </head>
          <body>
            <h1>Allure reports</h1>
            <ul>
              <li><a href="qa_homework_eighteen/allure-report/bookstore/index.html">Bookstore suite</a></li>
              <li><a href="qa_homework_eighteen/allure-report/book/index.html">Book suite</a></li>
              <li><a href="qa_homework_eighteen/allure-report/login/index.html">Login suite</a></li>
            </ul>
          </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
